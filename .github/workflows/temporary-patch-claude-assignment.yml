name: Validate Claude coordination assignment fix

on:
  push:
    branches: [fix/claude-coordination-stale-assignment]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/claude-coordination-stale-assignment
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply source patch
        run: python3 scripts/fix-claude-coordination-assignment.py
      - name: Run coordination regression tests
        run: pnpm exec vitest run server/room-coordination.e2e.test.ts server/drivers/claude.test.ts --maxWorkers=2
      - name: Typecheck
        run: pnpm typecheck
      - name: Commit tested fix
        shell: bash
        run: |
          rm .github/workflows/temporary-patch-claude-assignment.yml scripts/fix-claude-coordination-assignment.py
          git config user.name "Carbon"
          git config user.email "127478722+carbongotfound@users.noreply.github.com"
          git add server/index.ts .github/workflows/temporary-patch-claude-assignment.yml scripts/fix-claude-coordination-assignment.py
          git commit -m "fix(coordination): include assignment in teammate user turn"
          git push origin HEAD:fix/claude-coordination-stale-assignment
